[project]
name = "sdbench"
version = "0.1.0"
description = "SysDesign-Bench: a fully deterministic benchmark for system design from requirements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Ciabattoni" }]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
run = [
    "litellm>=1.40",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sdbench = "sdbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
