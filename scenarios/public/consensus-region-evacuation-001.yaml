# A five-voter consensus migration replacing a majority of identities. Directly
# installing the new list admits disjoint old/new majorities; caught-up learners
# and one joint-consensus transition preserve both safety and region-loss quorum.
instance_id: consensus-region-evacuation-001
domain: consensus-membership-migration
difficulty: hard
version: "0.3.0"
split: public

problem_statement: |
  A metadata service uses one five-voter consensus group. Its current voter set
  is:

  - region A: A1, A2
  - region B: B1, B2
  - region C: C1

  Region A must be fully evacuated, and host B2 reaches mandatory retirement in
  the same window. Region D is ready. The approved replacement nodes are C2,
  D1, and D2, so the required final voter identities are B1, C1, C2, D1, D2.
  This replaces three of five voters and leaves only B1 and C1 common to the old
  and new configurations.

  The service must remain able to commit while ANY ONE of regions A, B, C, or D
  is unavailable, including during membership change. No committed entry may be
  lost and two leaders must never commit divergent entries. New nodes start
  empty but may join as non-voting learners and copy the log while traffic
  continues. The consensus implementation supports joint membership, where a
  commit must win a majority of both old and new voter sets.

  Design the target placement, learner catch-up gate, membership transition,
  and point at which evacuated hosts may be destroyed.

context: |
  A majority of a five-voter set is three. During joint membership, losing a
  region is tolerated only if at least three old voters AND at least three new
  voters remain. Snapshot transfer alone is not proof of catch-up; the leader
  exposes a durable match index and committed-index comparison for each learner.

constraints:
  - id: C1
    type: topology
    value: "final voter identities are exactly B1, C1, C2, D1, D2; A1/A2 evacuate and B2 retires"
  - id: C2
    type: availability
    value: "a commit quorum must remain after loss of any one region A, B, C, or D at every migration stage"
  - id: C3
    type: consistency
    value: "no disjoint old/new configurations may independently commit; no committed log entry may be lost"
  - id: C4
    type: durability
    value: "a replacement may vote only after its durable match index reaches the leader's committed index"

requirements:
  - id: R1
    text: Place the final five voters so any one target region can fail without losing quorum.
  - id: R2
    text: Change a majority of voter identities without admitting disjoint commit quorums or uncaught voters.
  - id: R3
    text: Keep the old hosts recoverable until the new configuration is durably finalized.

flows:
  - id: target_configuration
    description: Final voter count by region after A evacuation and B2 retirement.
    decision_slots:
      placement:
        - b-one-c-two-d-two
        - b-two-c-one-d-two
        - b-one-c-one-d-three
  - id: replacement_admission
    description: State of C2, D1, and D2 before they receive votes.
    decision_slots:
      gate:
        - add-as-learners-and-verify-durable-match-index-at-committed-index
        - add-as-voters-then-copy-the-log
        - accept-snapshot-transfer-start-as-sufficient
  - id: membership_change
    description: Ordered transition from the old five identities to the required new five.
    decision_slots:
      protocol:
        - catch-up-learners-enter-joint-old-plus-new-commit-joint-finalize-new-then-decommission-old
        - atomically-replace-old-voter-list-with-new-voter-list
        - remove-a1-a2-b2-first-then-add-c2-d1-d2

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: slot_match
    flow: target_configuration
    slot: placement
    acceptable: [b-one-c-two-d-two]
  - id: g2
    dimension: migration_safety
    check: slot_match
    flow: replacement_admission
    slot: gate
    acceptable: [add-as-learners-and-verify-durable-match-index-at-committed-index]
  - id: g3
    dimension: migration_safety
    check: slot_match
    flow: membership_change
    slot: protocol
    acceptable: [catch-up-learners-enter-joint-old-plus-new-commit-joint-finalize-new-then-decommission-old]
  - id: g4
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [failure-domain-aware-placement]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [quorum-writes, data-verification-reconciliation]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [rollback-plan]
  - id: g7
    dimension: parsimony
    check: parsimony
    max_patterns: 6

traps:
  - id: T1
    description: Install the required five-node list in one configuration write; consensus will elect a leader from whichever list is current.
    violated_constraint_id: C3
    why_attractive: The target list is fully specified and an atomic metadata update sounds indivisible. But old quorum {A1,A2,B2} and new quorum {C2,D1,D2} are disjoint. If different nodes learn different configuration records, each side can form a majority and commit divergent logs; joint consensus is what forces overlap at commit time.
  - id: T2
    description: Put three voters in new region D to minimize cross-region replication during the evacuation.
    violated_constraint_id: C2
    why_attractive: Concentrating replacements reduces transfer latency and makes D an obvious new home. Losing D would leave only two of five voters, below the majority of three, so the final service would fail the explicit single-region-loss requirement.
  - id: T3
    description: Promote C2, D1, and D2 as soon as snapshot transfer starts, then let normal replication finish catch-up.
    violated_constraint_id: C4
    why_attractive: Voting early restores a five-node count quickly, and a snapshot appears to contain the state. A partially transferred or not-durably-applied learner can join a winning quorum without committed suffix entries; durable match-index equality is the admission proof, not transfer initiation.

twist:
  description: >
    A region evacuation that replaces a majority of voter identities: both old
    and new layouts look healthy in isolation, yet a direct switch admits
    disjoint majorities and unsafe commits.
  invalidated_canonical: >
    "Add the new servers and update the member list" fails g2 and g3. The exact
    safe transition is learner catch-up, joint old+new consensus, committed joint
    configuration, finalized new configuration, and only then decommissioning;
    placement must also retain both old and new majorities after every region loss.
  twist_gold_refs: [g1, g2, g3]

gold_rationale: |
  Target placement (g1, g4, T2): C1 fixes the identities, so the final counts are
  B={B1}=1, C={C1,C2}=2, D={D1,D2}=2. A five-voter majority is three. Losing B
  leaves four; losing C leaves B1+D1+D2=3; losing D leaves B1+C1+C2=3. A 1/1/3
  layout fails on loss of its three-voter region, and retaining two B voters is
  impossible because B2 must retire.

  Catch-up (g2, g5, T3): C2, D1, and D2 first join with zero votes. Each must
  durably apply through the leader's committed index and report its match index
  before promotion. This preserves all committed entries even if a replacement
  participates immediately in the next quorum. Merely starting snapshot transfer
  supplies neither completeness nor durability.

  Joint-consensus safety (g3, g5, T1): old O={A1,A2,B1,B2,C1}; new
  N={B1,C1,C2,D1,D2}. Direct installation is unsafe because O can commit with
  {A1,A2,B2} while N commits with disjoint {C2,D1,D2}. In the joint phase every
  entry needs three votes from O AND three from N, so no entry can be committed
  solely by one configuration. The committed joint record is followed by a
  committed new-only record before any old host is destroyed.

  Availability proof during the joint phase (C2): after loss of A, O retains
  B1+B2+C1=3 and N retains 5. After loss of B, O retains A1+A2+C1=3 and N retains
  C1+C2+D1+D2=4. After loss of C, O retains A1+A2+B1+B2=4 and N retains
  B1+D1+D2=3. After loss of D, O retains 5 and N retains B1+C1+C2=3. Thus every
  named regional failure leaves both required majorities.

  Retirement (g6): A1, A2, and B2 remain intact until the new-only configuration
  and its committed index are durable. That rollback boundary avoids turning a
  membership typo or catch-up defect into data loss; destruction before final
  commit would remove the only replicas able to prove the old configuration.
