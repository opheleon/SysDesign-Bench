# Easy floor item. Boring municipal CRUD at tiny scale with two sharp edges:
# read-your-writes (which replicas and caches silently break) and auditor
# point-in-time reconstruction. Every scaling-blog reflex is scored as
# over-engineering.
instance_id: permit-system-001
domain: gov-records
difficulty: easy
version: "0.3.0"
split: public

problem_statement: |
  A city is replacing its building-permit system. Clerks create and update
  permit records; applicants view status. After a clerk saves a change, their
  very next read — and any colleague's — must show that change: this is global
  read-after-write visibility, not merely a per-user session guarantee. Stale
  reads cause double-issued permits and legal disputes and are unacceptable at
  any window.

  State auditors additionally require point-in-time reconstruction: for any
  permit, show exactly what the record contained at any past moment, for
  seven years.

  Scale, measured from the current system: 30,000 permits/year, 200 clerk
  accounts, peak load 20 requests/second during Monday-morning rush. The IT
  team is 3 developers who also maintain four other city systems.

  City IT supplies one approved managed read/write database endpoint, backed by
  either PostgreSQL 16 or MySQL 8; failover is handled behind that endpoint.
  The project is not approved to add a replica read endpoint, cache, broker, or
  another database technology. Permit search must support permit number,
  address, applicant, and status at p99 <= 250 ms at the stated peak.

  Design the system: storage, read path, and how the audit requirement is met.

context: |
  Data size: seven years of permits with full history fits in well under
  10 GB. Growth is flat. No seasonal spikes beyond the Monday rush already
  included in the 20 rps figure.

constraints:
  - id: C1
    type: consistency
    value: "global read-after-write visibility for all users with zero staleness after an acknowledged save"
  - id: C2
    type: scale
    value: "20 requests/second peak; 30,000 permits/year; <10 GB total data; indexed permit-number/address/applicant/status searches p99 <=250 ms"
  - id: C3
    type: compliance
    value: "auditors can reconstruct any permit's exact contents at any past moment, 7-year retention"
  - id: C4
    type: team
    value: "3 developers shared across five city systems; minimal operational surface"
  - id: C5
    type: other
    value: "use the city's single managed PostgreSQL 16 or MySQL 8 read/write endpoint; no replica endpoint, cache, broker, or additional database technology is approved"

requirements:
  - id: R1
    text: Clerks create, update, and search permit records; applicants view status.
  - id: R2
    text: Any read after a save reflects the save (no stale reads).
  - id: R3
    text: Point-in-time reconstruction of any permit for auditors throughout the seven-year retention period.

flows:
  - id: permit_reads
    description: Where reads are served from.
    decision_slots:
      read_source: [primary, read-replica, cache-layer]
      consistency: [strong, eventual]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: role_required
    acceptable_roles: [system-of-record]
    acceptable_components: [postgresql-16, mysql-8]
  - id: g2
    dimension: tradeoff_selection
    check: role_forbidden
    role: system-of-record
    forbidden_components: [redis-7, memcached, cassandra-4, mongodb-7]
  - id: g3
    dimension: tradeoff_selection
    check: slot_match
    flow: permit_reads
    slot: read_source
    acceptable: [primary]
  - id: g4
    dimension: tradeoff_selection
    check: slot_match
    flow: permit_reads
    slot: consistency
    acceptable: [strong]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [temporal-audit-log, event-sourcing]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [secondary-indexes]
  - id: g7
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [postgresql-16, mysql-8]
  - id: g8
    dimension: operability
    check: pattern_forbidden
    forbidden: [read-replicas, cache-aside, write-through-cache, write-behind-cache, edge-caching, cdn-caching]
  - id: g9
    dimension: operability
    check: pattern_forbidden
    forbidden: [cqrs]
  - id: g10
    dimension: parsimony
    check: parsimony
    max_patterns: 5

traps:
  - id: T1
    description: Serve reads from asynchronous replicas or a cache-aside/edge cache "for performance and availability".
    violated_constraint_id: C1
    why_attractive: It is the default first move of every web-architecture article, and it feels like free robustness. But asynchronous replicas and caches introduce exactly the staleness window C1 forbids — and at 20 rps there is no load to offload in the first place.
  - id: T2
    description: Add CQRS with an asynchronously refreshed read model "since the auditors need history anyway".
    violated_constraint_id: C1
    why_attractive: >-
      Audit history genuinely suggests an event log, and event sourcing itself
      is valid when replay/current state are committed synchronously in the
      approved database. The trap is asynchronous CQRS: its projection lag
      violates global zero-stale visibility. A temporal table is simpler, but
      both temporal history and synchronous event sourcing are accepted.
  - id: T3
    description: Choose a distributed NoSQL store for "future scale".
    violated_constraint_id: C5
    why_attractive: Nobody gets fired for planning for scale. But C5 limits the project to the city's managed relational endpoint, and the stated ceiling (20 rps, <10 GB, flat growth) provides no reason to seek an exception.

twist:
  description: >
    A deliberately boring problem whose stated numbers make the fashionable
    answers wrong: the scale is tiny, the consistency bar is absolute, and the
    audit requirement has a one-pattern SQL answer.
  invalidated_canonical: >
    The standard web-scale CRUD stack — asynchronous read replicas, cache-aside,
    and an asynchronously projected CQRS model — is scored as a violation here
    (g8/g9): it either breaks C1's global visibility rule or adds infrastructure
    that C5 explicitly disallows. A synchronous event log remains a valid,
    though less parsimonious, audit implementation.
  twist_gold_refs: [g8, g9]

gold_rationale: |
  Capacity math (g3, g6-g9, T1, T3): a single PostgreSQL/MySQL instance on
  modest hardware sustains thousands of simple transactional requests per
  second; the stated peak is 20 rps with <10 GB of data — roughly 0.5% of one
  primary's comfortable capacity, with flat growth. Asynchronous replicas,
  cache-aside, and asynchronously refreshed CQRS views add staleness (violating
  C1's zero-window global visibility) and operational surface (C4/C5) without
  needed capacity. Synchronous replicas or a correctly
  version-validated cache could preserve visibility in another scenario, but
  C5 explicitly makes neither available here. The approved strongly consistent
  read/write endpoint is therefore entailed. Secondary indexes on permit
  number, address, applicant, and status satisfy the explicit search bound (g6).

  Audit (g5, T2): C3 asks for point-in-time reconstruction throughout seven
  years. Temporal tables
  or immutable audit rows provide it natively and are the parsimonious choice.
  Event sourcing in the same approved database is also correct if the current
  state is updated synchronously in the write transaction; it is therefore
  accepted. Only an asynchronously updated CQRS projection violates C1. Both
  accepted history shapes retain the immutable record for that full period.

  Store choice (g1, g2): global read-after-write visibility plus temporal
  history is native to the city-approved relational endpoint. Redis/Memcached,
  Cassandra, and MongoDB are also excluded directly by C5, rather than by an
  unsupported claim that no alternative technology could implement the logic.
