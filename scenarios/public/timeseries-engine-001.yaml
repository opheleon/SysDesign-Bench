# Storage-engine internals scenario ("design a database", made gradable):
# engine structure choices are decision slots entailed by workload math, and
# the GDPR erasure deadline collides with the immutable-segment canon —
# crypto-shredding is the only answer that survives the arithmetic.
instance_id: timeseries-engine-001
domain: metrics-platform
difficulty: medium
version: "0.3.0"
split: public

problem_statement: |
  A monitoring vendor is building the storage engine for its multi-tenant
  metrics platform (the team owns the engine internals — this is not a
  pick-a-vendor-DB question; the component menu applies only to surrounding
  infrastructure).

  Workload facts:
  - Ingest: 5,000,000 data points/second, arriving roughly in time order
    per series (~16 bytes/point raw). That is ~7 TB/day, ~2.5 PB/year raw.
  - Queries: dashboards read recent per-series time ranges (last hours to
    days), p99 <= 200 ms. Historical queries (weeks to months) tolerate
    seconds and touch aggregates far more often than raw points.
  - Retention: raw points for 30 days; downsampled aggregates for 13 months;
    everything expires after that.
  - Legal: a tenant can invoke data erasure; ALL of that tenant's data must
    be verifiably unreadable within 30 days of the request, including data
    inside the 13-month aggregate window. Erasure requests arrive weekly.
    The regulator explicitly accepts audited destruction of per-tenant
    envelope-encryption keys as verified erasure.

  The fixed hot-tier hardware budget sustains 250,000 random 4 KB writes/s or
  2 GB/s of sequential writes. Prototype measurements for this workload show
  update-in-place B-tree batching still needs at least one random page write
  per eight points, while an LSM configuration has <=8x total write
  amplification. Under the full 5M-point/s ingest and worst-case 8x compaction
  load, the prototype LSM with a sparse per-series secondary index measures
  recent-range p99 at 135 ms; without that index it measures 430 ms. The
  13-month aggregate set is 120 TB logical; the cold-tier
  storage cap is 30 TB. Measured compression is 6:1 for columnar segments and
  at best 2:1 for the row-oriented alternative.

  Design the engine's write path, historical storage layout, and the erasure
  mechanism.

context: |
  Tenants are commingled in storage for cost reasons (dedicated
  storage-per-tenant was rejected: median tenant is tiny). Object storage
  holds cold segments partitioned by time and metric family, so a typical
  long-lived tenant appears in nearly every segment. Compaction runs
  continuously. The monthly erasure-rewrite allowance is 5 TB of object-store
  reads plus writes; measurements show one typical tenant erasure would touch
  roughly 20 TB of compressed shared segments.

constraints:
  - id: C1
    type: throughput
    value: "5M points/second sustained ingest (~7 TB/day raw); fixed hot tier allows 250K random 4KB writes/s or 2GB/s sequential; measured B-tree >=1 random page write/8 points and LSM <=8x sequential write amplification"
  - id: C2
    type: latency
    value: "recent per-series range queries p99 <=200 ms; measured indexed LSM is 135 ms under full ingest/compaction while unindexed LSM is 430 ms; historical queries tolerate seconds"
  - id: C3
    type: compliance
    value: "per-tenant erasure verifiably complete within 30 days of request, including inside the 13-month aggregate retention window; requests arrive weekly"
  - id: C4
    type: budget
    value: "13-month aggregates are 120TB logical with a 30TB cold-storage cap; columnar compression measured 6:1 vs row 2:1; erasure rewrite allowance <=5TB/month while one typical tenant touches ~20TB of shared segments"

requirements:
  - id: R1
    text: Sustain 5M points/second ingest without falling behind.
  - id: R2
    text: Serve recent per-series range scans within the latency budget.
  - id: R3
    text: Keep 13 months of downsampled history affordably.
  - id: R4
    text: Complete tenant erasure within 30 days, verifiably.

flows:
  - id: write_path
    description: The structure absorbing 5M points/second.
    decision_slots:
      structure: [lsm-style-append-and-merge, b-tree-update-in-place]
  - id: cold_layout
    description: Layout of historical data in object storage.
    decision_slots:
      layout: [columnar-immutable-segments, row-oriented-mutable-files]
  - id: erasure
    description: How tenant erasure is executed against immutable history.
    decision_slots:
      mechanism: [rewrite-every-affected-segment, per-tenant-crypto-shredding, defer-until-retention-expiry]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: slot_match
    flow: write_path
    slot: structure
    acceptable: [lsm-style-append-and-merge]
  - id: g2
    dimension: tradeoff_selection
    check: slot_match
    flow: cold_layout
    slot: layout
    acceptable: [columnar-immutable-segments]
  - id: g3
    dimension: tradeoff_selection
    check: slot_match
    flow: erasure
    slot: mechanism
    acceptable: [per-tenant-crypto-shredding]
  - id: g4
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [lsm-tree]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [secondary-indexes]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [time-series-rollups]
  - id: g7
    dimension: requirements_coverage
    check: coverage
    requirement: R4
    acceptable: [crypto-shredding]
  - id: g8
    dimension: tradeoff_selection
    check: pattern_required
    acceptable: [ttl-expiry]
  - id: g9
    dimension: operability
    check: pattern_required
    acceptable: [compaction-strategy]
  - id: g10
    dimension: parsimony
    check: parsimony
    max_patterns: 8

traps:
  - id: T1
    description: Update-in-place B-tree storage for the write path.
    violated_constraint_id: C1
    why_attractive: B-trees are the default mental model of "a database" and give great point reads. But the measured one-page-per-eight-points floor is 625K random writes/s against the fixed 250K ceiling. The LSM path writes 80MB/s raw x8 amplification = 640MB/s sequential, safely below 2GB/s.
  - id: T2
    description: Execute erasure by rewriting every segment containing the tenant's data.
    violated_constraint_id: C4
    why_attractive: >
      It is the direct, honest reading of "make the data unreadable" and it
      demonstrably works. But tenants are commingled: a weekly erasure request
      touches about 20 TB of shared segments, four times the entire monthly
      5 TB rewrite allowance for a single request — and requests arrive weekly.
  - id: T3
    description: Defer erasure until normal retention expiry ("it all ages out anyway").
    violated_constraint_id: C3
    why_attractive: TTL expiry already exists in the design, so reusing it feels elegant and free. But the aggregate window is 13 months and the legal deadline is 30 days — deferral is a compliance violation by more than an order of magnitude, not an engineering tradeoff.

twist:
  description: >
    A storage-engine design where the celebrated property of time-series
    engines — immutable, compressed, append-only segments — collides with a
    30-day erasure mandate over commingled tenants.
  invalidated_canonical: >
    The TSDB canon (immutable columnar segments, "deletes are just retention
    expiry" — the documented posture of mainstream time-series engines) fails
    g3: with weekly erasure requests, a 13-month window, and
    commingled segments, neither segment rewriting nor wait-for-retention
    survives the explicit caps. Per-tenant encryption keys with audited key
    destruction (crypto-shredding) is the only listed mechanism satisfying C3
    within C4, and the regulator explicitly accepts it.
  twist_gold_refs: [g3]

gold_rationale: |
  Write path (g1, g4, g5, g9, T1): 5M x 16 bytes = 80 MB/s raw. The measured B-tree
  floor is 5M/8 = 625K random page writes/s, 2.5x the 250K fixed-hardware
  ceiling. LSM sequential traffic is at most 80 MB/s x8 = 640 MB/s, only 32%
  of the 2 GB/s sequential budget. Compaction (g9) is required to bound the
  resulting immutable runs. At that full load, the indexed LSM's measured
  recent-range p99 is 135 ms and meets C2; the unindexed 430 ms result makes the
  sparse per-series secondary index required coverage for R2 (g5). The slot is
  pinned by measured resource bounds, not by a generic preference for LSM.

  Cold layout and rollups (g2, g6, g8): dashboards hit recent raw
  data (row-ish recent tier is fine in the memtable/hot tier), while
  13-month queries hit aggregates. The aggregate set is 120 TB logical:
  measured 6:1 columnar compression yields 20 TB and fits the 30 TB cap;
  row-oriented 2:1 yields 60 TB and fails it by 2x. Rollups and columnar
  segments therefore jointly make R3 affordable. TTL expiry implements both
  retention edges (30-day raw, 13-month aggregates).

  Erasure (g3, g7, T2, T3): the three listed mechanisms are exhaustive for the
  stated shared immutable layout.
  Rewriting one typical tenant touches ~20 TB, already 4x the entire 5 TB
  monthly rewrite allowance; weekly requests widen the gap to ~16x. Deferral:
  13 months > 30 days (C3 rules this out, flatly). Crypto-shredding:
  encrypt each tenant's data under per-tenant keys at write time (cheap,
  symmetric, per-segment-per-tenant data keys); erasure = destroy the keys,
  making data in every immutable segment — including inside aggregates keyed
  the same way — verifiably unreadable within minutes, at zero rewrite cost.
  The prompt explicitly states regulator acceptance, so this is compliant by
  construction rather than an assumed legal interpretation. The immutability
  canon survives because erasure moves to the key layer.
