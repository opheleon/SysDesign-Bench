# Long-form sibling of omnichannel-inventory-001: IDENTICAL gold sets, but the
# binding facts are buried inside ~1,200 words of realistic program
# documentation (policy manual, marketplace agreement, IT assessment, marketing
# memo, incident review) alongside decoys. The structured constraints are
# deliberately pointers into the document. The score delta between this pair
# isolates requirements-extraction-under-load from design skill.
instance_id: omnichannel-inventory-haystack-001
domain: retail-commerce
difficulty: hard
version: "0.3.0"
split: public

problem_statement: |
  You are the architect for Meridian Apparel Group's Unified Inventory
  Program (UIP). Design the inventory system: how each sales channel
  allocates stock, what happens during store connectivity loss, and how
  conflicts are resolved.

  The binding requirements are distributed across the program documentation
  reproduced in the context below — policy manual excerpts, the marketplace
  agreement, the IT infrastructure assessment, and related memos. Extract
  what is binding; not everything in the documentation affects the design.

context: |
  ================================================================
  DOCUMENT 1 — UNIFIED INVENTORY PROGRAM: PHASE 2 BRIEF (excerpts)
  ================================================================

  Meridian Apparel Group operates 300 retail locations and a direct
  e-commerce channel. Phase 1 of UIP consolidated purchasing and
  distribution-center (DC) operations onto the shared merchandise pool.
  Phase 2 unifies live inventory across channels: store shelf stock, DC
  stock, and in-transit stock become one sellable pool of approximately
  2 million active SKUs.

  Phase 2 introduces Ship-From-Store (SFS): e-commerce orders may be
  fulfilled from any store's shelf stock, not only from the DC. Pilot data
  from 12 stores shows SFS reduces split shipments 31% and improves
  same-state delivery times by 1.4 days. Under SFS, a store's physical
  shelf units are simultaneously sellable to a walk-in customer and to any
  online customer nationwide. Chain-wide sales volume across both channels
  peaks at approximately 40 transactions per second (holiday peak,
  measured 2025).

  Program success metrics: inventory accuracy at 99.5% or better by cycle
  count; online order cancellation rate within contractual bounds (see
  Marketplace Agreement, Document 3); zero increase in store transaction
  time; reconciliation labor reduced 80% versus the Phase 1 manual
  process, which the CFO has described as "three regional teams doing
  archaeology in spreadsheets every Monday."

  ================================================================
  DOCUMENT 2 — STORE OPERATIONS POLICY MANUAL, REV 11 (excerpts)
  ================================================================

  §4.1 Store hours are set regionally. Registers open 15 minutes before
  posted hours. §4.2 Cash management follows the dual-count procedure at
  open and close; discrepancies over $50 are reported same-day. §4.3
  Returns without receipt are limited to store credit at the lowest
  30-day selling price, manager approval required over $150.

  §4.4 Price overrides beyond 20% require district approval through the
  POS approval queue. Where the approval queue is unreachable, overrides
  are limited to 20% and logged for next-day review. §4.5 Loss-prevention
  event tags on high-value SKUs are deactivated only at tender. §4.6
  Associates may not hold merchandise for customers beyond close of
  business without a paid deposit.

  §4.7 Continuity of tender. It is the position of Meridian Apparel Group
  that a customer standing at a register with merchandise and payment is
  served, without exception. Registers shall complete sales — all tender
  types the store supports — during any loss of wide-area connectivity,
  telecommunications failure, or central-system unavailability, however
  long it persists. No corporate system dependency shall be introduced
  that prevents a store from selling what is on its shelves. This section
  supersedes any conflicting integration requirement in any other program
  document.

  §4.8 Records of sales completed during connectivity loss are retained
  at the store with the same durability obligations as connected sales
  and are transmitted for central reconciliation upon restoration of
  service. Systematic reconciliation applies; see also the Fall Incident
  Review (Document 6). §4.9 Associates clock in via the workforce app;
  paper timecards are accepted at locations designated by HR.

  ================================================================
  DOCUMENT 3 — ONLINE MARKETPLACE & FULFILLMENT AGREEMENT (excerpts)
  ================================================================

  §7 Service levels. Order acknowledgment within 2 minutes of payment
  authorization. Shipment within the SLA matrix by service tier (Exhibit
  D). Customer-service response within one business day.

  §8 Payments. Settlement occurs T+2 via the acquiring bank. Chargebacks
  are passed through at cost plus the network fee. The fraud-screening
  vendor (Document 6 references the 2024 selection) scores transactions
  pre-authorization; orders scoring above 850 are held for manual review
  for up to 4 hours.

  §9 Inventory accuracy; remedies. Merchant warrants that sellable
  quantities presented to the Marketplace reflect inventory available for
  fulfillment. An order canceled for inventory unavailability
  ("oversell cancellation") triggers: (a) full refund; (b) a $12 goodwill
  credit funded by Merchant; (c) inclusion in the monthly Oversell Rate
  calculation. 9.1 Should the Oversell Rate exceed one half of one
  percent (0.5%) of completed orders in any calendar month, Merchant
  incurs the Schedule-C penalty tier and, upon a third consecutive month,
  Marketplace may suspend the Merchant storefront. 9.2 Quantities
  presented MAY be reduced by Merchant at any time without penalty;
  presenting quantities the Merchant cannot verify as available at
  fulfillment time is the sole basis of oversell liability.

  §10 Returns follow the harmonized policy in Exhibit F.

  ================================================================
  DOCUMENT 4 — IT INFRASTRUCTURE ASSESSMENT, UIP PHASE 2 (excerpts)
  ================================================================

  Store connectivity: all 300 locations operate on dual-carrier SD-WAN.
  Measured availability by location averages 99.0% (fleet median 99.2%,
  worst decile 97.8%). In practical terms the average store experiences
  roughly seven hours of full WAN unavailability per month, typically in
  episodes of 10-50 minutes, with tail events exceeding 8 hours during
  regional carrier incidents (two such events in the trailing 12 months).

  In-store systems: POS terminals run the current-generation register
  platform with local compute and storage at every location; the store
  server closet hosts the returns kiosk and the local network head-end.

  Legacy note: the nightly inventory export to the AS/400-based
  merchandising system (COBOL batch, fixed-width format, 02:00 window) is
  scheduled for retirement in Phase 3 when merchandising cutover
  completes. Phase 2 systems MUST NOT take a dependency on the nightly
  export or its file format; it exists only for legacy merchandising
  reports during the transition and its schedule is frozen — integration
  teams should treat it as read-only exhaust, not an interface.

  Capacity: chain-wide transaction peak 40/s (Document 1); DC WMS API
  sustains 500 requests/second; the e-commerce platform autoscales within
  its own budget envelope and is out of scope for this assessment.

  ================================================================
  DOCUMENT 5 — MARKETING MEMO: HOLIDAY LAUNCH CALENDAR (excerpts)
  ================================================================

  BOPIS (buy-online-pickup-in-store) relaunches November 4 with the
  "Ready in 90" campaign — 90-minute pickup promise, marketed in the top
  40 DMAs. Promo engine ships SKU-level markdown waves each Thursday
  10:00 ET through December. The gift-card double-points event runs
  Black Friday through Cyber Monday. Creative refresh for SFS-eligible
  PDPs ("Ships today from your local store") gated on Phase 2 go-live.
  Note: campaign dates are marketing commitments, not engineering
  deadlines; engineering go/no-go is governed by the program steering
  committee (Document 1 owners).

  ================================================================
  DOCUMENT 6 — FALL INCIDENT REVIEW (excerpts)
  ================================================================

  During the November 24 regional carrier incident (6h11m, 38 stores),
  stores continued operating per policy §4.7. Upon service restoration,
  central inventory showed 1,204 units sold in-store that e-commerce had
  concurrently sold or promised, including 61 SFS orders allocated
  against shelf stock of disconnected stores. Resolution took 11 days of
  manual work across three teams, produced 214 customer-visible
  cancellations processed under Agreement §9 (all within the monthly
  rate), and one Schedule-C near-miss. Review board directive: Phase 2
  shall resolve cross-channel conflicts systematically upon store
  reconnection, with customer-facing outcomes (backorder, substitution,
  refund per policy) applied automatically and an auditable trail;
  Monday-spreadsheet archaeology is explicitly retired. The board also
  noted the 2024 fraud-vendor selection is unaffected by Phase 2 and
  requires no integration changes.

constraints:
  - id: C1
    type: availability
    value: "register behavior during connectivity loss is governed by Store Operations Policy §4.7 and the measured WAN figures in the IT assessment (Documents 2 and 4)"
  - id: C2
    type: consistency
    value: "online inventory accuracy obligations and oversell remedies per Marketplace Agreement §9 (Document 3)"
  - id: C3
    type: durability
    value: "offline-sale retention and systematic reconciliation obligations per Policy §4.8 and the incident review directive (Documents 2 and 6)"
  - id: C4
    type: scale
    value: "scale, connectivity, and capacity figures — and the integration prohibitions and scope disclaimers — per the program brief, IT assessment, and marketing memo (Documents 1, 4, and 5)"

requirements:
  - id: R1
    text: Stores comply with Policy §4.7/§4.8 during and after connectivity loss.
  - id: R2
    text: Online selling complies with Marketplace Agreement §9.
  - id: R3
    text: Cross-channel conflicts resolve per the incident review board directive.
  - id: R4
    text: SFS exposure of store stock to online buyers remains §9-compliant during store connectivity loss.
    implicit: true

flows:
  - id: store_pos
    description: Store register behavior during a WAN outage.
    decision_slots:
      outage_policy: [continue-selling-from-local-state, reject-sales-until-reconnect]
  - id: online_allocation
    description: How online checkout claims a unit.
    decision_slots:
      consistency: [strong-transactional-reserve, eventual-optimistic-allocate]
  - id: conflict_resolution
    description: Resolving units sold twice across channels during an outage.
    decision_slots:
      mechanism: [compensation-workflow-with-defined-outcomes, last-write-wins-overwrite, manual-review-queue-only]
  - id: sfs_during_outage
    description: Ship-from-store availability of an OFFLINE store's stock to online buyers.
    decision_slots:
      policy: [withhold-offline-store-stock-from-online, keep-selling-offline-store-stock-online]

relaxation_options: []

expected_mode: design

