traps:
  - id: T1
    description: Registers coordinate with the central system per sale (2PC or synchronous reserve) for a single consistent pool.
    violated_constraint_id: C1
    why_attractive: Document 1's "one sellable pool" framing and §9's accuracy warranty both pull toward uniform strong consistency — unless the reader has absorbed §4.7, which flatly supersedes any such integration and is reinforced by the seven-hours-per-month WAN figure four documents away.
  - id: T2
    description: Optimistic/eventual online allocation with post-hoc cleanup.
    violated_constraint_id: C2
    why_attractive: The incident review shows cancellations being processed routinely, which reads like organizational tolerance — unless the reader connects §9.1's 0.5% monthly rate, the Schedule-C near-miss, and the storefront-suspension escalation, which price routine oversell as existential.
  - id: T3
    description: Treat the AS/400 nightly export or the BOPIS launch dates as design drivers (build around the batch window; architect for the "Ready in 90" deadline).
    violated_constraint_id: C4
    why_attractive: Both decoys are written in the urgent register of real constraints — a legacy COBOL batch with a frozen schedule and a marketed 90-minute promise with dates. But Document 4 explicitly forbids depending on the export ("read-only exhaust"), and Document 5 explicitly disclaims the dates as non-engineering commitments; designing around either is reacting to noise.

twist:
  description: >
    The short-form sibling (omnichannel-inventory-001) states five binding
    facts in five bullet points; this scenario buries the same facts across
    ~1,200 words of realistic program documentation with two aggressive
    decoys. Gold sets are IDENTICAL — the score delta between siblings
    isolates requirements-extraction-under-load.
  invalidated_canonical: >
    Skimming for the familiar problem shape retrieves "unified inventory
    pool, keep it consistent" from Document 1 and fails g1/T1 against
    §4.7's buried supremacy clause; reading the incident review as
    tolerance for cancellations fails g2/T2 against §9.1's buried rate cap;
    and the urgency-toned decoys (frozen COBOL batch window, marketed
    90-minute promise) bait designs around facts the documents themselves
    disclaim as non-binding.
  twist_gold_refs: [g1, g2, g7]

gold_rationale: |
  Identical entailment to omnichannel-inventory-001 — see that scenario's
  rationale for the full math. This file's contribution is the burial map:

  Needle 1 (drives g1, g5, g11; kills T1): Policy §4.7 "continuity of
  tender" — mid-manual, after four paragraphs of cash-handling minutiae —
  states registers sell through ANY connectivity loss and SUPERSEDES
  conflicting integration requirements; Document 4 quantifies the
  partition frequency (avg ~7h/store/month; 8h+ tail events). Together
  they entail offline-first local allocation for POS.

  Needle 2 (drives g2; kills T2): Agreement §9.1 prices oversell — 0.5%
  monthly rate cap, penalty tier, storefront suspension on the third
  consecutive breach; §9.2 makes UNVERIFIABLE presented quantity the sole
  basis of liability. Entails strong transactional reserve online.

  Needle 3 (drives g7/R4): §9.2's liability basis plus Document 6's 61
  SFS orders allocated against disconnected stores' shelves — an offline
  store's stock is unverifiable at fulfillment time by definition, so it
  must be withheld from online presentation during the outage
  (explicitly penalty-free per §9.2).

  Directive (drives g3, g4, g6, g10): Document 6's board directive names
  the required shape — systematic resolution on reconnection with
  automatic customer-facing outcomes and an audit trail — i.e., a
  compensation workflow (saga), not LWW (silently erases one sale;
  retired "archaeology") and not a manual queue (11 days, three teams).

  Decoys (T3): the AS/400 export carries every marker of a binding legacy
  constraint but Document 4 forbids depending on it; the BOPIS calendar
  carries dates and a marketed promise but Document 5 disclaims them as
  non-engineering commitments; the fraud vendor is stated twice to need
  no integration changes. Designing around any of these is noise-reaction
  that the parsimony cap (g12) and forbidden-pattern checks price.
