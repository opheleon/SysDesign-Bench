# De-labeled maps backend, safety-inverted: consumer-nav canon (everything
# eventual, fail-open) is wrong here. Closures are safety-critical and must be
# strongly consistent / fail-closed; congestion stays eventual. Tests mixed
# consistency models and right-sizing for a small on-prem deployment.
instance_id: mine-routing-001
domain: industrial-routing
difficulty: medium
version: "0.3.0"
split: public

problem_statement: |
  An underground mining operator needs a routing backend for its vehicle
  fleet. Vehicles drive through a tunnel network and receive routes from the
  backend. There is no GPS underground: positioning comes from fixed beacons
  along tunnels. Connectivity is mesh Wi-Fi with known dead zones — vehicles
  drop offline for up to two minutes routinely.

  Two kinds of dynamic information affect routing:

  1. SECTION CLOSURES, declared by the safety office (blasting, maintenance,
     collapse risk). Routing a vehicle through a closed section is a
     potentially fatal safety incident. A declaration immediately blocks new
     entry authorizations. A closure becomes active 90 seconds later, after
     every previously issued authorization has necessarily expired.
  2. CONGESTION, derived from vehicle position reports. It affects ETAs and
     route choice but has no safety implication. Individual reports can be
     wrong (beacon glitches, sensor faults).

  The tunnel graph itself changes about daily as sections are dug or sealed.

  The backend runs on two on-prem servers at the mine site, operated by a
  4-person software team. Fleet: 120 vehicles, each reporting position once
  per second. Design the routing backend: how closures and congestion
  propagate, how vehicles behave through dead zones, and what runs on which
  store.

context: |
  Load numbers: 120 vehicles x 1 report/second = 120 writes/second sustained.
  Routing requests: a few per minute. Tunnel graph: ~3,000 sections. History
  retention for congestion analytics: 90 days (~1 TB upper bound).

  Vehicles may enter a section only with a signed authorization for the current
  closure epoch. Authorizations last at most 60 seconds, the longest section
  traversal is 45 seconds, and a vehicle may not enter unless its authorization
  covers the whole traversal. Safe stopping bays exist at every section
  boundary. On a declaration, issuance for that section stops immediately; the
  90-second activation delay therefore exceeds every outstanding authorization
  by at least 30 seconds. An offline vehicle may finish its currently authorized
  section, but must stop at the next bay before entering another one.

  The observed bad telemetry consists only of duplicate reports, non-adjacent
  beacon transitions, impossible speeds above 50 km/h, or out-of-order sequence
  numbers; every erroneous report violates at least one of those predicates.
  Congestion must not block route computation: during telemetry-path failure the
  router continues from the last accepted congestion view for up to 60 seconds.
  Accepted reports update an asynchronously refreshed materialized congestion
  view; the 3,000-section graph and that view are read by the route engine.

constraints:
  - id: C1
    type: consistency
    value: "a declaration immediately stops new entry authorizations; activation is 90 seconds later, after all <=60-second authorizations expire; no vehicle may enter an active closure"
  - id: C2
    type: network
    value: "no GPS; beacon positioning; mesh Wi-Fi with dead zones - vehicles routinely offline up to 2 minutes; safe bays exist at every section boundary"
  - id: C3
    type: consistency
    value: "congestion is advisory and propagated asynchronously; route computation must remain available during telemetry-path failure using a last-accepted view no older than 60 seconds"
  - id: C4
    type: team
    value: "4-person team, two on-prem servers; the only approved durable stores are PostgreSQL 16 and MySQL 8, and adding another database technology is not permitted"
  - id: C5
    type: scale
    value: "120 vehicles, 120 telemetry writes/second, ~3,000 graph sections - small scale"

requirements:
  - id: R1
    text: Compute routes over the tunnel graph for vehicles.
  - id: R2
    text: A declaration immediately blocks new entry authorizations, and no vehicle enters the section at or after its 90-second activation.
  - id: R3
    text: Vehicle position reports feed congestion-aware ETAs and route choice.
  - id: R4
    text: A vehicle that loses connectivity behaves safely with respect to closures.
    implicit: true
  - id: R5
    text: Reports matching the stated duplicate, sequence, adjacency, or speed error model are rejected before influencing congestion.
    implicit: true

flows:
  - id: closure_propagation
    description: How a declared closure reaches the router and the fleet.
    decision_slots:
      consistency: [strong, eventual]
      failure_policy: [fail-closed, fail-open]
  - id: congestion_updates
    description: How position-derived congestion flows into routing.
    decision_slots:
      consistency: [strong, eventual]
  - id: offline_vehicle
    description: Vehicle behavior while out of coverage in a dead zone.
    decision_slots:
      policy: [proceed-on-cached-route-without-authorization, finish-current-authorized-section-then-halt-at-boundary]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: slot_match
    flow: closure_propagation
    slot: consistency
    acceptable: [strong]
  - id: g2
    dimension: tradeoff_selection
    check: slot_match
    flow: closure_propagation
    slot: failure_policy
    acceptable: [fail-closed]
  - id: g3
    dimension: tradeoff_selection
    check: slot_match
    flow: congestion_updates
    slot: consistency
    acceptable: [eventual]
  - id: g4
    dimension: operability
    check: slot_match
    flow: offline_vehicle
    slot: policy
    acceptable: [finish-current-authorized-section-then-halt-at-boundary]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R4
    acceptable: [staleness-fallback]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [fail-closed]
  - id: g7
    dimension: tradeoff_selection
    check: role_required
    acceptable_roles: [system-of-record]
    acceptable_components: [postgresql-16, mysql-8]
  - id: g8
    dimension: tradeoff_selection
    check: role_forbidden
    role: ingest-store
    forbidden_components: [cassandra-4]
  - id: g9
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [postgresql-16, mysql-8]
  - id: g10
    dimension: requirements_coverage
    check: coverage
    requirement: R5
    acceptable: [admission-control]
  - id: g11
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [materialized-views]
  - id: g12
    dimension: parsimony
    check: parsimony
    max_patterns: 8

traps:
  - id: T1
    description: Propagate closures the same way as congestion — eventually consistent pub/sub, vehicles pick it up when they reconnect.
    violated_constraint_id: C1
    why_attractive: It is exactly how every consumer navigation stack handles road closures, it is one code path instead of two, and "eventually within seconds" sounds close enough — until a vehicle in a dead zone proceeds on a stale plan into a blast zone.
  - id: T2
    description: Make everything strongly consistent, including congestion, "since safety matters here".
    violated_constraint_id: C3
    why_attractive: Uniform strictness feels safe and simple. But synchronously coordinating advisory telemetry with route computation prevents the required last-known-view fallback during telemetry-path failure. C3 explicitly requires asynchronous propagation and continued routing availability for this non-safety data.
  - id: T3
    description: Deploy Cassandra for telemetry ingest "because time-series writes at fleet scale".
    violated_constraint_id: C4
    why_attractive: Vehicle telemetry pattern-matches to the wide-column ingest story. But the actual load is 120 writes/second and ~1 TB retained — three orders of magnitude below where Cassandra earns its operational cost for a 4-person team running two servers.

twist:
  description: >
    A navigation backend where the consumer-maps consistency model is inverted:
    the safety-critical fact (closures) demands strong, fail-closed handling
    while the familiar telemetry fact (congestion) stays eventual — and the
    scale is deliberately three orders of magnitude below the canon's.
  invalidated_canonical: >
    The consumer navigation canon (Waze/Google-Maps-style: all dynamic data
    eventually consistent, fail-open, wide-column telemetry ingest) fails g1,
    g2, and g8 here: eventual closures are a fatal safety violation, fail-open
    is the wrong default, and canonical big-ingest storage is over-engineering
    at 120 writes/second.
  twist_gold_refs: [g1, g2, g8]

gold_rationale: |
  Mixed consistency is entailed, not stylistic. Closures (C1): the authoritative
  closure epoch is read strongly and ambiguity resolves to blocked (g1/g2).
  The authorization timing closes the former partition hole: declaration at T
  stops issuance immediately; every token expires by T+60; activation is T+90.
  A disconnected vehicle can finish only a traversal already covered by a
  token (at most 45 seconds), then stops at the boundary (g4/g5). It therefore
  cannot enter after activation even during a two-minute dead zone. Congestion
  is explicitly different: C3 requires asynchronous propagation and routing
  from a <=60-second last-accepted view when telemetry is unavailable, so a
  synchronous strong dependency fails the availability rule. The materialized
  congestion view supplies that decoupled read path (g3/g11/T2).

  Right-sizing (g7, g8, T3): 120 writes/second and ~1 TB/90 days is roughly
  0.1% of a single PostgreSQL server's comfortable write capacity; the tunnel
  graph is 3,000 rows. C4 also limits the approved durable-store menu to
  PostgreSQL/MySQL, so Cassandra is not merely unnecessary but unavailable.
  Erroneous reports (R5/g10) are handled completely for the stated error model
  by boundary validation: deduplicate sequence IDs, require adjacent beacon
  transitions and monotonic sequence numbers, and reject implied speeds above
  50 km/h before a report can influence congestion.
