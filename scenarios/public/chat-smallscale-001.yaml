# Minimal pair with chat-presence-2m-001: the same chat surface at 1/1000th
# the scale. Every big-chat reflex (Kafka, Cassandra, sharding) is
# scored over-engineering; one general-purpose durable primary plus a simple
# push/poll tier is sufficient. Easy floor item for the parsimony dimension.
instance_id: chat-smallscale-001
domain: workplace-chat
difficulty: easy
version: "0.3.0"
split: public

problem_statement: |
  A 2,000-employee company wants an internal chat tool (they are leaving a
  discontinued product). Peak concurrency is about 1,200 connected clients.
  Measured peak message rate on the old system: 50 messages/second, small
  conversations (avg 4 recipients). Total history over five years is about
  40 GB of text.

  Requirements: messages are never lost once accepted; each conversation
  shows a consistent order; full-text search over history; presence dots in
  the sidebar. The tool is run by a 2-person internal IT dev team on two
  on-prem VMs. Choose the architecture.

context: |
  Growth is bounded by headcount (~5%/year). No external users. The old
  system's outages were caused by unattended complexity, which is why the
  team insists on something they can operate themselves. All services must run
  on the two on-prem VMs. The operating approval permits exactly one stateful
  subsystem: a PostgreSQL, MySQL, or MongoDB primary. Those are the only
  approved system-of-record choices; a separately operated broker, search
  datastore, or other database technology is not approved.

constraints:
  - id: C1
    type: scale
    value: "1,200 peak concurrent clients; 50 messages/second peak; 40 GB history over 5 years"
  - id: C2
    type: team
    value: "2-person team, two on-prem VMs; exactly one stateful subsystem is approved, chosen from PostgreSQL, MySQL, or MongoDB; no separate broker or search datastore"
  - id: C3
    type: durability
    value: "accepted messages are never lost; per-conversation consistent ordering"

requirements:
  - id: R1
    text: Acknowledge messages only after durable storage, then deliver them in per-conversation order.
  - id: R2
    text: Full-text search over message history.
  - id: R3
    text: Presence indicators for connected users.
  - id: R4
    text: The 2-person team can operate the whole system.

flows:
  - id: delivery
    description: Getting messages to connected clients.
    decision_slots:
      transport: [websocket-push, server-sent-events, long-polling, udp-custom-reliability]
      durability_point: [durable-before-ack, best-effort-fanout]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: role_required
    acceptable_roles: [system-of-record]
    acceptable_components: [postgresql-16, mysql-8, mongodb-7]
  - id: g2
    dimension: tradeoff_selection
    check: role_forbidden
    role: system-of-record
    forbidden_components: [cassandra-4, redis-7, memcached]
  - id: g3
    dimension: tradeoff_selection
    check: slot_match
    flow: delivery
    slot: durability_point
    acceptable: [durable-before-ack]
  - id: g4
    dimension: tradeoff_selection
    check: slot_match
    flow: delivery
    slot: transport
    acceptable: [websocket-push, server-sent-events, long-polling]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [write-ahead-log]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [inverted-index]
  - id: g7
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [websocket-push, server-sent-events, long-polling]
  - id: g8
    dimension: requirements_coverage
    check: coverage
    requirement: R4
    acceptable: [postgresql-16, mysql-8, mongodb-7]
  - id: g9
    dimension: operability
    check: pattern_forbidden
    forbidden: [sharding, autoscaling]
  - id: g10
    dimension: operability
    check: role_forbidden
    role: message-queue
    forbidden_components: [kafka, rabbitmq, sqs]
  - id: g11
    dimension: parsimony
    check: parsimony
    max_patterns: 5

traps:
  - id: T1
    description: The big-chat reference architecture — broker-backed fan-out, wide-column message store, sharded services.
    violated_constraint_id: C2
    why_attractive: Every published chat architecture is written for millions of users, so pattern-matching the problem type retrieves that stack. At 50 msgs/s and 40 GB, all of it is idle machinery the 2-person team must operate — which is the failure mode that made them leave the previous product.
  - id: T2
    description: Best-effort fan-out with async persistence "since chat feels ephemeral".
    violated_constraint_id: C3
    why_attractive: It simplifies the hot path and at this scale everything feels fast. But C3 says accepted messages are never lost — the durable write must precede the delivery ack, and at 50/s the cost of doing it right is negligible.
  - id: T3
    description: A dedicated search cluster for full-text search.
    violated_constraint_id: C2
    why_attractive: '"Full-text search" pattern-matches to a search engine deployment. But the 40 GB corpus fits the built-in text index of any accepted primary, and a separate cluster doubles the operational surface for the 2-person team.'

twist:
  description: >
    The identical problem surface as the 2M-user sibling scenario at 1/1000th
    scale — the pair punishes answering the problem TYPE instead of the
    problem NUMBERS.
  invalidated_canonical: >
    The published big-chat reference stack (broker fan-out, wide-column
    storage, and sharding) fails g2/g9/g10/g11 here: at 50
    messages/second with a 2-person operations team, one relational primary
    or document primary with built-in full-text search and a simple delivery
    tier is the entailed
    architecture, and each additional moving part is a scored violation.
  twist_gold_refs: [g2, g9, g10]

gold_rationale: |
  Capacity and operability (g1, g2, g8-g11): 50 messages/second and 40 GB over
  five years fit one general-purpose ACID primary on the stated VMs. The prompt
  explicitly makes PostgreSQL, MySQL, and MongoDB supportable, so the benchmark
  does not over-prescribe a relational model where none is required. Nothing
  creates a second scaling problem: sharding, a separate message broker, or
  autoscaling on two fixed VMs adds operational surface (C2) with no capacity
  need. The failure mode being designed against is unattended complexity, not
  a particular database brand.

  Durability (g3, g5, T2): C3 requires accepted-means-durable; a write-ahead
  log commit to the primary precedes the acknowledgement, then fan-out to
  connected clients. At 50/s there is no throughput pressure to trade against,
  so best-effort acknowledgement is a pure violation.

  Search (g6, T3): the accepted primary's built-in inverted full-text index
  over 40 GB satisfies R2 with one system; a separate search cluster doubles
  what the 2-person team operates for no required capability.

  Transport and presence (g4, g7): WebSocket push, SSE plus an HTTP write
  channel, and held-request long polling can all deliver an event immediately
  at 1,200 clients. The same channel carries presence changes, so all three are
  accepted; custom UDP reliability adds implementation burden without a stated
  latency or head-of-line requirement.
