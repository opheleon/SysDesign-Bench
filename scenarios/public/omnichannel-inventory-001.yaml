# One inventory pool, two channels, two OPPOSITE correct CAP answers: store
# registers must keep selling through WAN outages (availability) while online
# checkout must never oversell (consistency), reconciled afterward by
# compensation. Uniform consistency in either direction is a scored trap.
instance_id: omnichannel-inventory-001
domain: retail-commerce
difficulty: medium
version: "0.3.0"
split: public

problem_statement: |
  A 300-store apparel retailer sells the same inventory pool in stores and
  online. Facts:

  - Store WAN links average 99% availability — roughly seven hours of
    disconnection per store per month, usually in sub-hour episodes.
  - Company policy, non-negotiable: a cash register NEVER stops taking
    payment. Store sales must complete during WAN outages.
  - Online checkout must never sell inventory that does not exist. An
    oversold online order (cancel + apologize) is contractually capped at
    0.5% of online orders and each incident carries real cost.
  - While a store is offline it can, by definition, sell units that online
    also sold. These conflicts must be resolved systematically when the
    store reconnects — with a defined customer-facing outcome (backorder,
    substitute, refund per policy), not manual spreadsheets.
  - Scale: ~2M SKUs, ~40 sales/second chain-wide peak (both channels).

  Design the inventory system: how each channel allocates stock, what
  happens during store WAN outages, and how post-outage conflicts resolve.

context: |
  Stores hold local stock physically present in the building; the shared
  pool at the distribution center serves online. A store sells mostly its
  own shelf stock, but ship-from-store makes store stock visible to online.
  Store connectivity is monitored by heartbeat; an outage is detected
  within 30 seconds, and the withhold decision for a store's stock applies
  from detection forward. Online orders allocated against a store's stock
  in the pre-detection window are resolved by the standard conflict
  workflow and count toward the 0.5% cap — the cap exists precisely to
  price that bounded window.

constraints:
  - id: C1
    type: availability
    value: "registers never stop: store sales complete during WAN outages (links ~99% available, ~7h/store/month down)"
  - id: C2
    type: consistency
    value: "online checkout never allocates inventory it cannot verify as available at fulfillment time (verifiable-availability is the liability basis); online-vs-online races must be impossible; cross-channel conflicts created by store outages count toward the 0.5% online cancellation cap and are resolved per C3"
  - id: C3
    type: durability
    value: "offline store sales are never lost and must reconcile systematically on reconnect with a defined customer-facing outcome"
  - id: C4
    type: scale
    value: "300 stores, ~2M SKUs, ~40 sales/second chain-wide peak"

requirements:
  - id: R1
    text: Stores sell through WAN outages without data loss.
  - id: R2
    text: Online checkout allocates against real inventory with no oversell beyond the contractual cap.
  - id: R3
    text: Post-outage conflicts resolve automatically with defined compensation.
  - id: R4
    text: Ship-from-store exposure of store stock to online does not break R2 during outages.
    implicit: true

flows:
  - id: store_pos
    description: Store register behavior during a WAN outage.
    decision_slots:
      outage_policy: [continue-selling-from-local-state, reject-sales-until-reconnect]
  - id: online_allocation
    description: How online checkout claims a unit.
    decision_slots:
      consistency: [strong-transactional-reserve, eventual-optimistic-allocate]
  - id: conflict_resolution
    description: Resolving units sold twice across channels during an outage.
    decision_slots:
      mechanism: [compensation-workflow-with-defined-outcomes, last-write-wins-overwrite, manual-review-queue-only]
  - id: sfs_during_outage
    description: Ship-from-store availability of an OFFLINE store's stock to online buyers.
    decision_slots:
      policy: [withhold-offline-store-stock-from-online, keep-selling-offline-store-stock-online]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: tradeoff_selection
    check: slot_match
    flow: store_pos
    slot: outage_policy
    acceptable: [continue-selling-from-local-state]
  - id: g2
    dimension: tradeoff_selection
    check: slot_match
    flow: online_allocation
    slot: consistency
    acceptable: [strong-transactional-reserve]
  - id: g3
    dimension: tradeoff_selection
    check: slot_match
    flow: conflict_resolution
    slot: mechanism
    acceptable: [compensation-workflow-with-defined-outcomes]
  - id: g4
    dimension: tradeoff_selection
    check: pattern_required
    acceptable: [saga]
  - id: g5
    dimension: operability
    check: pattern_required
    acceptable: [offline-first-sync]
  - id: g6
    dimension: operability
    check: pattern_required
    acceptable: [reconciliation-on-reconnect]
  - id: g7
    dimension: tradeoff_selection
    check: slot_match
    flow: sfs_during_outage
    slot: policy
    acceptable: [withhold-offline-store-stock-from-online]
  - id: g8
    dimension: tradeoff_selection
    check: pattern_forbidden
    forbidden: [last-write-wins]
  - id: g9
    dimension: tradeoff_selection
    check: role_required
    acceptable_roles: [system-of-record]
    acceptable_components: [postgresql-16, mysql-8, mongodb-7, cassandra-4]
  - id: g10
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [saga, reconciliation-on-reconnect]
  - id: g11
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [offline-first-sync]
  - id: g12
    dimension: parsimony
    check: parsimony
    max_patterns: 9

traps:
  - id: T1
    description: Keep the whole pool strongly consistent — registers coordinate with the central system per sale (2PC or synchronous reserve).
    violated_constraint_id: C1
    why_attractive: One consistency model is simpler to reason about, and C2's oversell cap makes "strong everywhere" feel like the safe direction. But a register that needs central coordination stops selling for ~7 hours per store per month — a direct, quantified violation of the never-stop policy.
  - id: T2
    description: Make everything eventual — online allocates optimistically and conflicts get cleaned up later.
    violated_constraint_id: C2
    why_attractive: Eventual-everything is symmetric, simple, and matches the offline-store reality anyway. But online checkout races against itself at all times, not just during outages; optimistic allocation of a finite pool makes overselling routine rather than exceptional, breaching the 0.5% contractual cap.
  - id: T3
    description: Resolve cross-channel conflicts by last-write-wins on the inventory record.
    violated_constraint_id: C3
    why_attractive: LWW needs no workflow — the row just converges. But converging the COUNT silently erases one of the two SALES; C3 requires a defined customer-facing outcome for the losing order, which is a compensation workflow (saga), not a merge rule.

twist:
  description: >
    One system, one inventory pool, and the CAP question answered twice with
    opposite correct answers — plus the ship-from-store wrinkle where the
    availability channel and the consistency channel touch the same physical
    unit during a partition.
  invalidated_canonical: >
    Canonical inventory designs pick one consistency posture ("inventory is
    money, make it transactional" or "retail is distributed, go eventual and
    reconcile"). Either recitation fails half this scenario: uniform-strong
    fails g1 (registers stop), uniform-eventual fails g2 (oversell). The
    entailed design is split by failure cost — availability for in-person
    sales, strong reserves for online, sagas to reconcile — and the buried
    ship-from-store interaction (g7) is where uniform thinkers leak oversell
    even after getting the split right.
  twist_gold_refs: [g1, g2, g7]

gold_rationale: |
  The split is entailed by failure costs, not preference. Store channel
  (g1, g5, g11, T1): the cost of blocking a register is stated as absolute
  (company policy) and the partition frequency is quantified (~7h/store/
  month), so store sales must complete against local state and sync later —
  offline-first with durable local queuing (C3: no lost sales). Online
  channel (g2, g9, T2): the cost of oversell is contractual (0.5% cap with
  per-incident cost); at 40 sales/second chain-wide, transactional reserve
  against the system of record is cheap (three orders of magnitude inside a
  single primary's capacity) — there is no throughput excuse for optimism.

  Reconciliation (g3, g4, g6, g10, T3): during an outage, double-sale of
  the same physical unit is POSSIBLE by design — the resolution is a
  compensation workflow (saga): detect conflict on reconnect, apply the
  defined outcome (backorder/substitute/refund), notify. LWW (g8)
  converges the number while silently discarding a sale, failing C3's
  "defined customer-facing outcome". 2PC across store<->center is the T1
  trap: it converts every partition into a register outage and fails
  slot g1; within the always-connected online path, transactional
  reserves of any implementation are fine (g9 accepts any store capable
  of atomic conditional allocation — relational transactions, document
  transactions, or single-partition conditional writes all qualify at
  40 sales/second).

  Ship-from-store during outage (g7, R4): an offline store's stock cannot
  be safely promised online — the store may be selling it right now and
  cannot be asked. Withholding offline stores' stock from online
  availability closes the one path where the eventual channel's reality
  leaks into the strong channel's promise. Keeping it sellable reopens C2
  exactly during partitions — the subtle miss for models that got the
  headline split right.
