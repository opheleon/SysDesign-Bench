# Zero-downtime store migration where the clean expand/contract canon breaks:
# an 18-month tail of old mobile clients keeps writing through legacy API
# semantics, so writers can never be drained. Continuous sync + long-lived
# compatibility become mandatory; 2PC across the stores is the planted trap.
instance_id: mysql-to-postgres-migration-001
domain: data-migration
difficulty: medium
version: "0.3.0"
split: public

problem_statement: |
  A consumer app's backend (24/7, globally used) stores all state in MySQL 8.
  For organizational platform-standardization reasons that are not up for
  debate, the data must move to PostgreSQL 16. There is no acceptable
  maintenance window: the service must keep reading and writing throughout.

  The complication: the app's mobile clients. Old app versions remain in the
  wild for up to 18 months, and they write through legacy API endpoints whose
  request semantics are coupled to the old MySQL schema shapes. Forcing
  upgrades is not commercially acceptable; the legacy write paths must keep
  working, at full fidelity, for the entire 18-month tail — including long
  after the new store has become primary.

  Compliance requires demonstrated data parity between stores before any
  cutover, and a rollback path at every stage of the migration. During the
  migration, failure of the non-primary store or replication coordinator must
  not stop reads or writes on the current primary. Release policy also forbids
  exposing more than 5% of traffic to PostgreSQL until that cohort has run for
  30 minutes with zero reconciliation mismatches.

  Design the migration: how data moves, how both write paths stay correct,
  how parity is proven, how cutover happens, and how rollback works at each
  stage. Team: 6 engineers. Dataset: ~500 GB, ~2,000 writes/second peak.

context: |
  All writes flow through the company's API tier (mobile clients do not open
  database connections), but legacy endpoints assume old-schema semantics.
  The API tier can be modified; mobile clients cannot. MySQL binlog and
  PostgreSQL logical-WAL positions are durable and exposed. The API may instead
  place a target-store mutation in a transactional outbox in the current
  primary, but uncoordinated application dual-writes are prohibited: a partial
  write must never be acknowledged as replicated. Replicated mutations carry a
  stable operation ID and are idempotent. After PostgreSQL becomes primary,
  PostgreSQL-to-MySQL reverse sync remains active until rollback is retired.

constraints:
  - id: C1
    type: availability
    value: "zero planned downtime; reads and writes on the current primary continue if the non-primary store or replication coordinator is unavailable"
  - id: C2
    type: compliance
    value: "legacy client write paths (old API semantics) keep working at full fidelity for an 18-month tail; forcing upgrades is not acceptable"
  - id: C3
    type: compliance
    value: "demonstrated parity at a named source log position before each cutover cohort advances"
  - id: C4
    type: durability
    value: "rollback exists at every stage; every acknowledged primary write is durably captured in its WAL/binlog or transactional outbox before acknowledgement, and reverse sync keeps the rollback store current after cutover"
  - id: C5
    type: scale
    value: "~500 GB dataset, ~2,000 writes/second peak"
  - id: C6
    type: compliance
    value: "cutover is cohort-gated: at most 5% initially, then advance only after 30 minutes with zero reconciliation mismatches; every stage is reversibly flagged"

requirements:
  - id: R1
    text: All historical data moves from MySQL 8 to PostgreSQL 16.
  - id: R2
    text: Legacy-endpoint writes keep working at full fidelity for the 18-month tail.
  - id: R3
    text: Parity between stores is systematically verified before cutover.
  - id: R4
    text: Every migration stage can be rolled back.
  - id: R5
    text: The current primary remains readable and writable if the non-primary store or replication coordinator fails.
  - id: R6
    text: Cutover obeys the 5% cohort gate and zero-mismatch observation window.

flows:
  - id: sync_mechanism
    description: How writes reach both stores while both matter.
    decision_slots:
      mechanism: [stop-the-world-dump-restore, continuous-sync-from-primary-wal-or-outbox, distributed-transaction-across-both]
  - id: cutover
    description: How read/write primacy moves from MySQL to PostgreSQL.
    decision_slots:
      style: [big-bang-switch, gradual-flagged-cohorts]
  - id: legacy_writes
    description: How old-API writes are handled once PostgreSQL is primary.
    decision_slots:
      handling: [translate-at-api-boundary, reject-legacy-writes, keep-mysql-primary-forever]
  - id: rollback_sync
    description: How MySQL remains a lossless rollback target after PostgreSQL becomes primary.
    decision_slots:
      post_cutover: [stop-syncing-to-mysql, reverse-sync-postgres-to-mysql]

relaxation_options: []

expected_mode: design

gold:
  - id: g1
    dimension: migration_safety
    check: slot_match
    flow: sync_mechanism
    slot: mechanism
    acceptable: [continuous-sync-from-primary-wal-or-outbox]
  - id: g2
    dimension: requirements_coverage
    check: coverage
    requirement: R1
    acceptable: [backfill]
  - id: g3
    dimension: requirements_coverage
    check: coverage
    requirement: R2
    acceptable: [versioned-api-compatibility, anti-corruption-layer]
  - id: g4
    dimension: requirements_coverage
    check: coverage
    requirement: R3
    acceptable: [data-verification-reconciliation, shadow-reads]
  - id: g5
    dimension: requirements_coverage
    check: coverage
    requirement: R4
    acceptable: [rollback-plan]
  - id: g6
    dimension: requirements_coverage
    check: coverage
    requirement: R5
    acceptable: [cdc-replication, outbox]
  - id: g7
    dimension: migration_safety
    check: slot_match
    flow: cutover
    slot: style
    acceptable: [gradual-flagged-cohorts]
  - id: g8
    dimension: tradeoff_selection
    check: slot_match
    flow: legacy_writes
    slot: handling
    acceptable: [translate-at-api-boundary]
  - id: g9
    dimension: tradeoff_selection
    check: pattern_forbidden
    forbidden: [two-phase-commit, dual-write]
  - id: g10
    dimension: migration_safety
    check: slot_match
    flow: rollback_sync
    slot: post_cutover
    acceptable: [reverse-sync-postgres-to-mysql]
  - id: g11
    dimension: requirements_coverage
    check: coverage
    requirement: R6
    acceptable: [feature-flag-cutover, canary-release, staged-rollout]
  - id: g12
    dimension: parsimony
    check: parsimony
    max_patterns: 10

traps:
  - id: T1
    description: Keep both stores consistent with distributed transactions (2PC/XA) spanning MySQL and PostgreSQL.
    violated_constraint_id: C1
    why_attractive: '"Both stores must agree" reads like a textbook atomic-commit problem, and 2PC is the textbook answer. But C1 explicitly requires the current primary to keep accepting writes when the other store or coordinator is unavailable; blocking atomic commit violates that named failure guarantee. Durable WAL/outbox replication preserves primary availability and proves eventual parity.'
  - id: T2
    description: Dump-and-restore during a "brief" low-traffic window.
    violated_constraint_id: C1
    why_attractive: It is the simplest mental model of a migration and how every local-dev migration works. But 500 GB dump+restore+validate is hours of writes lost or blocked — there is no window, brief or otherwise, under C1.
  - id: T3
    description: Classic expand/contract with a deprecation deadline — after the transition period, old writers are retired and the old schema contracted away.
    violated_constraint_id: C2
    why_attractive: It is the canonical zero-downtime migration playbook and works when you control every writer. Here the 18-month uncontrollable client tail means "retire the old writers" is not available; contraction that breaks legacy semantics violates C2, so a long-lived translation layer at the API boundary is mandatory instead.
  - id: T4
    description: Issue unrelated application writes to MySQL and PostgreSQL and repair whichever side fails later.
    violated_constraint_id: C4
    why_attractive: It avoids a replication log and is often called dual-write. A crash after only one write succeeds leaves an acknowledged mutation absent from the rollback store. C4 instead requires the secondary mutation to originate from a durable primary WAL/binlog position or transactional outbox and to be idempotently replayable.

twist:
  description: >
    A standard zero-downtime store migration with one inverted assumption: the
    writers can never be drained. Old mobile clients keep writing old-schema
    semantics for 18 months, far past cutover.
  invalidated_canonical: >
    The clean expand/contract migration playbook assumes you control all
    writers and can retire the old write path on your schedule. Reciting it
    fails g3 and g8: with an uncontrollable 18-month client tail, the design
    must carry versioned API compatibility / an anti-corruption translation
    layer at the API boundary for the entire tail, translating legacy-semantic
    writes onto the new store after cutover.
  twist_gold_refs: [g3, g8]

gold_rationale: |
  Why continuous sync (g1, g2, g6, T2/T4): at 500 GB and 2,000 writes/second with no
  window (C1), the viable shape is bulk backfill while the source stays live,
  plus a continuous change stream from the current primary's durable binlog/WAL
  or transactional outbox. Stable operation IDs make replay idempotent.
  Uncoordinated application dual-write is forbidden because partial success can
  violate C4. Dump-and-restore requires a
  write freeze measured in hours (500 GB restore + index rebuild + catch-up),
  which C1 prices at infinity.

  Why not 2PC (g9, T1): synchronous atomic commit across MySQL+PostgreSQL
  makes every one of 2,000 writes/second depend on both stores and a
  coordinator being simultaneously healthy. C1 explicitly says the current
  primary must remain writable when either non-primary participant is down, so
  2PC violates the requirement rather than merely its spirit.
  C3 does not require instantaneous mutual consistency; it requires PROVEN
  parity before cutover, which async sync plus systematic reconciliation
  (counts, checksums, sampled row diffs — g4) delivers without coupling
  availability.

  Cutover and rollback (g5, g7, g10, g11): C6 makes gradual flagged cohorts
  mandatory: start at <=5%, reconcile for 30 mismatch-free minutes, then advance
  behind reversible flags. A big-bang switch violates the explicit first-cohort
  cap. After PostgreSQL becomes primary, PostgreSQL-to-MySQL reverse sync remains
  active (g10), so rollback cannot discard acknowledged post-cutover writes.

  The tail (g3, g8, T3): legacy endpoints encode old-schema semantics and
  cannot be removed for 18 months (C2). Post-cutover, those writes must be
  translated at the API boundary onto the new schema (versioned API
  compatibility / anti-corruption layer) — rejecting them violates C2, and
  keeping MySQL primary forever means the migration never completes.
